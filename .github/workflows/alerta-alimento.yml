name: Alerta diaria de stock de alimento

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install
      - name: Revisar stock y avisar si corresponde
        env:
          SUPABASE_URL: https://rnrgdogrxszirqjkucrv.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node alerta-alimento.mjs
