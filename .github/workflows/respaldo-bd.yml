name: Respaldo semanal de la base de datos

on:
  schedule:
    # Todos los lunes a las 09:00 UTC (~06:00 en Chile)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Agregar repositorio oficial de PostgreSQL
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list

      - name: Instalar cliente de PostgreSQL (v17, igual que Supabase)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Generar respaldo de la base de datos
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          fecha=$(date +'%Y-%m-%d')
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL?connect_timeout=15" --no-owner --no-privileges -F c -f "respaldo-erp-avicola-$fecha.dump"

      - name: Subir respaldo como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-erp-avicola-${{ github.run_id }}
          path: respaldo-*.dump
          retention-days: 60
